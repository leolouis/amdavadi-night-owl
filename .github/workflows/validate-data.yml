name: Validate data
on:
  push:
    paths: ['places.json', '.github/scripts/**']
  pull_request:
    paths: ['places.json', '.github/scripts/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/validate-places.mjs
